services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8081:8080"
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: